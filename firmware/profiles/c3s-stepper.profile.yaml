profile: c3s-stepper
board: esp32c3-supermini
app: node
net: { link_profile: default }
# Design stepper-s1 D13: a 10 mm micro stepper on a DRV8833 module (hardware/wiring/stepper-c3). The module as built
# has the TB6612-style pinout: STBY is the DRV8833's nSLEEP, and nFAULT is not brought out, so there is no fault bind.
# The config is the bench motor as measured: a 20.5 ohm coil (20 here: too low is the safe side), VM 5.2 V from USB,
# 150 mA while moving (58 % duty; the motor is rated 3.3 V, about 160 mA) and 30 % of it at rest. At 150 mA it ran
# ten turns out and back twice with no lost step; never set supply_mv below the real VM, or the cap lets more through.
caps:
  boot:   { cap: fr.button,  driver: button_gpio, bind: buttons.boot }
  status: { cap: fr.led,     driver: led_gpio,    bind: leds.status }
  motor:  { cap: fr.stepper, driver: drv8833_stepper,
            bind: { ain1: gpio.6, ain2: gpio.5, bin1: gpio.10, bin2: gpio.20, sleep: gpio.7 },
            config: { steps_per_rev: 20, step_mode: micro8, coil_ohm: 20, run_ma: 150, hold_pct: 30, supply_mv: 5200 } }
