; platformio.ini - the same firmware built by PlatformIO (framework = espidf).
;
;   pio run -e esp32-gc9a01            build
;   pio run -e esp32-gc9a01 -t upload  flash        pio device monitor   console
;   pio run -e esp32-gc9a01 -t menuconfig           the "Fractonica clock" menu
;
; PlatformIO builds the ESP-IDF project of this directory as it is: the root
; CMakeLists.txt, main/ (src_dir below) and components/. One environment per
; board and display; each adds its configs/*.defaults to sdkconfig.defaults
; exactly as tools/build-all.sh does for idf.py, and keeps its own
; sdkconfig.<environment> beside this file (not in the repository).
;
; The platform is pinned: espressif32 6.12.0 brings ESP-IDF 5.5.0, the release
; line this firmware is written for (new I2C master driver, esp_lcd, PCNT).
; The first build downloads PlatformIO's own copy of ESP-IDF and its
; toolchains (over 1 GB); idf.py from an installed ESP-IDF needs nothing.
;
; The clock core is the sibling checkout ../core (or ./core, or the path in
; the environment variable FRACTONICA_CORE_DIR): see CMakeLists.txt.

[platformio]
src_dir = main
default_envs = esp32-gc9a01

[env]
platform = espressif32@6.12.0
framework = espidf
monitor_speed = 115200
; ESP-IDF's own log colours and the console's echo want a real terminal.
monitor_filters = direct

; --- the three chips with the default display (GC9A01 240 x 240 round) -----

[env:esp32-gc9a01]
board = esp32dev

[env:esp32s3-gc9a01]
board = esp32-s3-devkitc-1
; The board file says 8 MB; sdkconfig.defaults says 4 MB, which every
; ESP32-S3 module has at least. Tell PlatformIO so the two agree.
board_upload.flash_size = 4MB

[env:esp32c3-gc9a01]
board = esp32-c3-devkitm-1

; --- the other displays ------------------------------------------------------

[env:esp32-st7789]
board = esp32dev
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;configs/st7789-240x240.defaults"

[env:esp32-st7789-240x320]
board = esp32dev
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;configs/st7789-240x320.defaults"

[env:esp32-ssd1306]
board = esp32dev
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;configs/ssd1306.defaults"

[env:esp32s3-st7789]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;configs/st7789-240x240.defaults"

[env:esp32c3-ssd1306]
board = esp32-c3-devkitm-1
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;configs/ssd1306.defaults;configs/buttons2.defaults"
