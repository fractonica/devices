capability: fr.display
id: 0x0003
version: "1.3"
summary: A pixel panel with drawing primitives everywhere and LVGL layouts where the panel's driver says so (trait ui).
doc: |
  Colours are 0xRRGGBB on the wire; a mono panel (color mono1) lights a pixel whose colour is at least 50 % luminance.
  Commands are queued to the renderer and never draw inside dispatch; the panel is flushed at most every flush_ms.
  Primitives (clear, text, fill_rect) work on every panel. ui_load and ui_set answer UNSUPPORTED where `ui` is false
  (the C3 OLED's built-in 1-bit renderer); on LVGL panels a layout replaces the screen and primitives sent after it
  draw on top. snapshot and snapshot_read read back the framebuffer as drawn (test builds), so an agent sees the real
  screen and compares it with the desktop render of the same commands (T-DISPLAY).
  An e-paper panel (trait epaper; design epaper-e1) keeps two 1-bit frames, what has been drawn and what the glass
  shows, and refreshes only the area where they differ: settle_ms after the last drawing command, at once on
  `refresh`, never during a `hold`. A refresh is partial (only changed pixels move, about 0.4 s), fast or full (the
  whole screen flashes; ghosts are cleared); full_every automatic partials are followed by a `clean` refresh.
  `bitmap` takes 1-bit pixels drawn elsewhere (the hub renders images and HTML), on every mono panel.
types:
  ColorFormat: { enum: { mono1: 0, rgb565: 1 } }
  Rotation:    { enum: { r0: 0, r90: 1, r180: 2, r270: 3 } }
  UiWidgetKind: { enum: { label: 0, button: 1, bar: 2, slider: 3, arc: 4, switch: 5, rect: 6 } }
  UiAlign:     { enum: { left: 0, center: 1, right: 2 } }
  UiEventKind: { enum: { clicked: 0, pressed: 1, released: 2, value_changed: 3 } }
  # Design epaper-e1 D2: how an e-paper panel changes its glass. auto: partial, or full when the glass is not known,
  # or `clean` when the ghost budget is spent.
  RefreshMode: { enum: { auto: 0, partial: 1, fast: 2, full: 3 } }
  # Design m2-c5-display D2: one widget of a layout (about 45 B on the wire for a typical one).
  UiWidget:
    doc: "One widget: `id` names it for ui_set and ui events; button, slider and switch emit ui events when touched."
    fields:
      id:    { id: 1,  type: string, max: 16 }
      kind:  { id: 2,  type: UiWidgetKind }
      x:     { id: 3,  type: i16, unit: px }
      y:     { id: 4,  type: i16, unit: px }
      w:     { id: 5,  type: u16, unit: px, doc: "0: sized to its content" }
      h:     { id: 6,  type: u16, unit: px, doc: "0: sized to its content" }
      text:  { id: 7,  type: string, max: 48, doc: "label and button text" }
      value: { id: 8,  type: i32, doc: "bar, slider, arc: the value; switch: 0 off, else on" }
      min:   { id: 9,  type: i32, doc: "bar, slider, arc: the range's bottom" }
      max:   { id: 10, type: i32, default: 100, doc: "bar, slider, arc: the range's top" }
      color: { id: 11, type: rgb, default: 0xFFFFFF, doc: "text, indicator or fill colour" }
      bg:    { id: 12, type: rgb, doc: "background colour" }
      font:  { id: 13, type: u8, range: [0, 2], doc: "0: 14 px, 1: 20 px, 2: 28 px (the built-in Montserrat sizes)" }
      align: { id: 14, type: UiAlign, doc: "text alignment inside the widget" }
  # Design m2-c5-display D2: a whole screen. 24 widgets at their maximum size exceed one BULK frame; a layout must fit one.
  UiLayout:
    doc: "A screen: its background and up to 24 widgets, drawn in order (later ones on top)."
    fields:
      bg:      { id: 1, type: rgb, doc: "screen background" }
      widgets: { id: 2, type: "array<UiWidget>", max: 24 }
traits:
  width:  { id: 1, type: u16 }              # pixels, after rotation (from the board entry)
  height: { id: 2, type: u16 }              # pixels, after rotation
  color:  { id: 3, type: ColorFormat }      # from the driver: ssd1306_i2c mono1, st7789_spi rgb565
  ui:     { id: 4, type: bool }             # LVGL layouts (ui_load, ui_set): the driver renders through LVGL
  touch:  { id: 5, type: bool }             # an fr.touch instance of the profile is bound to this panel
  round:  { id: 6, type: bool }             # the visible area is the circle inscribed in width x height (gc9a01_spi; design scale-round-c1 D5)
  epaper: { id: 7, type: bool }             # the panel keeps its image unpowered and changes it by refreshes (ssd1683_spi; design epaper-e1 D2)
config:
  rotation:   { type: Rotation, default: r0, doc: "panel rotation; a board entry's `rotation` (0, 90, 180, 270) is its default" }
  brightness: { type: u8, default: 255, doc: "backlight level at boot; ignored on panels without backlight control" }
  max_brightness: { type: u8, default: 255, range: [1, 255], doc: "a hard cap on the backlight: set_brightness and brightness scale into 0..max (design lcd-clock-c1 D4; 128 where the vendor warns against full brightness)" }
  flush_ms:   { type: u16, default: 20, range: [20, 1000], unit: ms, doc: "coalescing period: the panel is flushed at most this often (50 Hz); on e-paper the shortest time between the starts of two refreshes" }
  # Design epaper-e1 D2-D3: used only where trait epaper is true.
  settle_ms:   { type: u16, default: 60, range: [0, 1000], unit: ms, doc: "e-paper: an automatic refresh starts this long after the last drawing command" }
  full_every:  { type: u8, default: 5, range: [0, 100], doc: "e-paper: automatic partial refreshes before an automatic clean one (the vendor says 5); 0 never cleans automatically" }
  clean:       { type: RefreshMode, default: full, doc: "e-paper: the refresh that cleans ghosts, full or fast" }
  clean_hours: { type: u8, default: 24, range: [0, 168], doc: "e-paper: a clean refresh when the glass has had none for this long, even with nothing new (the vendor's 24 h rule); 0 off" }
  burst_ms:    { type: u16, default: 1000, range: [0, 5000], unit: ms, doc: "e-paper: the high voltage stays on this long after a partial, so a partial that follows starts sooner; 0 powers it down after every refresh" }
  sleep_s:     { type: u16, default: 10, range: [0, 3600], doc: "e-paper: deep sleep after this many seconds without a refresh; 0 never" }
  boot_clear:  { type: bool, default: false, doc: "e-paper: a full refresh to white at boot; false keeps the glass's picture across a reboot" }
properties:
  brightness: { id: 1, type: u8, doc: "the backlight level (255 on panels without backlight control)" }
  partials:   { id: 2, type: u8, requires: { trait: epaper }, doc: "partial refreshes since the last fast or full one" }
  shown_crc:  { id: 3, type: u32, requires: { trait: epaper }, doc: "CRC-32 of what the glass shows, in the snapshot layout; 0: not known since boot" }
  refresh_ms: { id: 4, type: u16, unit: ms, requires: { trait: epaper }, doc: "how long the last refresh took" }
commands:
  clear:
    id: 1
    delivery: reliable
    idempotent: true
    doc: Drops every primitive and any layout, and fills the panel with `color`.
    fields: { color: { id: 1, type: rgb } }
    examples: [ { color: 0x000000 } ]
  text:
    id: 2
    delivery: reliable
    doc: "A text primitive at (x, y), its top left. Size 1 is the panel's smallest font (LVGL: Montserrat 14/20/28 for sizes 1-3, 28 for 4; the C3: 5x7 glyphs scaled by size)."
    fields:
      x:     { id: 1, type: i16, unit: px }
      y:     { id: 2, type: i16, unit: px }
      text:  { id: 3, type: string, max: 64 }
      color: { id: 4, type: rgb, default: 0xFFFFFF }
      bg:    { id: 5, type: rgb }
      size:  { id: 6, type: u8, default: 1, range: [1, 4] }
    examples: [ { x: 4, y: 4, text: "hello", size: 2 } ]
  fill_rect:
    id: 3
    delivery: reliable
    doc: A filled rectangle primitive.
    fields:
      x:     { id: 1, type: i16, unit: px }
      y:     { id: 2, type: i16, unit: px }
      w:     { id: 3, type: u16, unit: px }
      h:     { id: 4, type: u16, unit: px }
      color: { id: 5, type: rgb }
    examples: [ { x: 0, y: 0, w: 40, h: 20, color: 0xFF0000 } ]
  set_brightness:
    id: 4
    delivery: reliable
    idempotent: true
    doc: Sets the backlight (property brightness); accepted and ignored on panels without backlight control.
    fields: { level: { id: 1, type: u8 } }
    examples: [ { level: 128 } ]
  ui_load:
    id: 5
    delivery: reliable
    bulk: true
    doc: "Replaces the screen with `layout` (LVGL panels; UNSUPPORTED where trait ui is false). BULK: TCP or serial, never over a gateway; the layout must fit one BULK frame."
    fields: { layout: { id: 1, type: UiLayout } }
    result: { widgets: { id: 1, type: u8, doc: "widgets created" } }
    examples:
      - layout:
          bg: 0x000000
          widgets:
            - { id: title, kind: label, x: 10, y: 10, text: "Fractonica", font: 1 }
            - { id: ok, kind: button, x: 60, y: 120, w: 120, h: 50, text: "OK", bg: 0x2060C0 }
  ui_set:
    id: 6
    delivery: reliable
    doc: "Updates widget `id`: `fields` says which of the others are set (1 text, 2 value, 4 color, 8 visible). NOT_FOUND for an unknown id; UNSUPPORTED where trait ui is false."
    fields:
      id:      { id: 1, type: string, max: 16 }
      text:    { id: 2, type: string, max: 64 }
      value:   { id: 3, type: i32 }
      color:   { id: 4, type: rgb }
      visible: { id: 5, type: bool }
      fields:  { id: 6, type: u8, range: [0, 15], doc: "bit mask: 1 text, 2 value, 4 color, 8 visible" }
    examples: [ { id: ok, text: "Done", fields: 1 } ]
  snapshot:
    id: 7
    visibility: test
    delivery: reliable
    bulk: true
    doc: "The framebuffer as drawn: its CRC-32 (IEEE, as zlib) and size. Read it with snapshot_read; T-DISPLAY compares the CRC with the desktop render's. BULK like snapshot_read: a device reachable only through a gateway is refused before a frame is frozen that no read could fetch."
    result:
      crc:    { id: 1, type: u32 }
      width:  { id: 2, type: u16 }
      height: { id: 3, type: u16 }
      format: { id: 4, type: ColorFormat, doc: "mono1: 1 bit per pixel, rows packed MSB first; rgb565: 2 bytes per pixel, little-endian" }
      bytes:  { id: 5, type: u32, doc: "framebuffer size in bytes" }
  snapshot_read:
    id: 8
    visibility: test
    delivery: reliable
    bulk: true
    doc: "A chunk of the framebuffer of the last snapshot (BULK: TCP or serial)."
    fields:
      offset: { id: 1, type: u32 }
      len:    { id: 2, type: u16, default: 1024, range: [1, 1024] }
    result: { data: { id: 1, type: bytes, max: 1024 } }
  bitmap:
    id: 9
    delivery: reliable
    bulk: true
    doc: "A rectangle of 1-bit pixels at (x, y): rows of ceil(w / 8) bytes, MSB first (the snapshot layout); a 1 takes `color`, a 0 `bg`, so with the defaults the bits are the frame's own (1 light). Clipped to the screen; INVALID_ARGS when data is not exactly ceil(w / 8) x h bytes. Mono panels (e-paper, the C3 OLED); UNSUPPORTED on LVGL panels. BULK: TCP or serial, never over a gateway."
    fields:
      x:     { id: 1, type: i16, unit: px }
      y:     { id: 2, type: i16, unit: px }
      w:     { id: 3, type: u16, unit: px }
      h:     { id: 4, type: u16, unit: px }
      data:  { id: 5, type: bytes, max: 1200 }
      color: { id: 6, type: rgb, default: 0xFFFFFF }
      bg:    { id: 7, type: rgb }
    examples: [ { x: 0, y: 0, w: 8, h: 2, data: "8001" } ]
  refresh:
    id: 10
    delivery: reliable
    doc: "E-paper: refresh now in `mode` (auto: partial, or full when the glass is not known, or the `clean` mode when the ghost budget is spent; an explicit partial runs past the budget; fast and full redraw the whole screen even with nothing new). RESULT: the mode that will run and whether the frame differs from the glass; `refreshed` follows (none when nothing changed and the mode is auto or partial). One refresh may wait while another runs; it takes the strongest mode asked. UNSUPPORTED where trait epaper is false."
    fields: { mode: { id: 1, type: RefreshMode } }
    result:
      mode:    { id: 1, type: RefreshMode }
      changed: { id: 2, type: bool }
    examples: [ { mode: auto }, { mode: full } ]
  hold:
    id: 11
    delivery: reliable
    idempotent: true
    doc: "E-paper: no automatic refresh for `ms` or until `refresh`; 0 releases. A client drawing many pieces holds, draws, then refreshes once; if it stops half-way the hold runs out. UNSUPPORTED where trait epaper is false."
    fields: { ms: { id: 1, type: u16, range: [0, 10000], unit: ms } }
    examples: [ { ms: 5000 } ]
events:
  ui:
    id: 1
    priority: normal
    requires: { trait: ui }
    doc: A widget was touched (or an injected touch hit it); `value` is the slider's or switch's new value.
    fields:
      id:    { id: 1, type: string, max: 16 }
      kind:  { id: 2, type: UiEventKind }
      value: { id: 3, type: i32 }
  refreshed:
    id: 2
    priority: normal
    requires: { trait: epaper }
    doc: "An e-paper refresh ended. x, y, w, h: the area that changed (the whole screen for fast and full); ok false when the panel did not finish in time (the next refresh is full); crc: what the glass shows now (shown_crc)."
    fields:
      mode:     { id: 1, type: RefreshMode }
      ok:       { id: 2, type: bool }
      ms:       { id: 3, type: u16, unit: ms }
      partials: { id: 4, type: u8 }
      x:        { id: 5, type: u16, unit: px }
      y:        { id: 6, type: u16, unit: px }
      w:        { id: 7, type: u16, unit: px }
      h:        { id: 8, type: u16, unit: px }
      crc:      { id: 9, type: u32 }
