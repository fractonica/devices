schema: fractonica/part@1
id: diode
name: Diode
category: semiconductor
summary: Rectifier, signal or Schottky diode; the stripe (bar) marks the cathode.
values: ["1N4148", "1N4007", "1N5819"]
specs:
  1N4148: signal, 100 V, 200 mA continuous; fine as an ERM flyback
  1N4007: rectifier, 1000 V, 1 A, slow (microseconds to turn off); a flyback only where the output is plain on and off, never under PWM
  1N5819: Schottky, 40 V, 1 A, ~0.4 V drop, fast; the flyback for a PWM'd solenoid or motor
pins:
  - { name: anode, desc: the plain end }
  - { name: cathode, desc: "the end with the stripe" }
notes:
  - "As a flyback across a motor or coil: stripe toward + (the supply side). Reversed, it shorts the supply every time the transistor turns on."
  - "Under PWM (fr.haptic level below 100, a solenoid's hold, a sigma-delta motor) the flyback must be fast: 1N5819 (or 1N5817, SS14, SS34), or a 1N4148 for a motor up to 200 mA. A 1N4007 still conducts for microseconds after the MOSFET turns back on: the supply is shorted through it at every edge (design haptic-h1 §0)."
