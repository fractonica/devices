# An example HIL bench (design m2-c1-hil D7, §2.3): one ESP32-S3 fixture (profile s3k-fixture) wired to four
# boards under test. The device ids are placeholders (vendor prefix kept, device bytes replaced).
#
# To use it: copy it to hardware/bench/lab.bench.yaml (git-ignored: the rig as wired is personal), put your boards'
# device ids (fr devices) in place of the placeholders, adjust the lines to your wiring, pin fixture.fw_id once the
# fixture runs a known build, and check it with `fr gen --check`. The hub loads hardware/bench/lab.bench.yaml unless
# it runs with --bench <name> or FR_BENCH.
schema: fractonica/bench@1
id: lab
fixture:
  device: e8f60a001048             # fix-s3: an ESP32-S3-DevKitC-1-style board (WROOM-1-N16R8)
  profile: s3k-fixture
  fw_id: null
  vdd_mv: 3300                     # the fixture's 3V3 rail: set_duty = round(mV / vdd_mv * 10000) (M2-C3)
duts:
  1cdbd40002c4:                    # pad-c3: a C3 OLED board with a weak radio
    profile: c3o-pad
    rf_weak: true                  # T-HIL: accounted RF losses warn instead of failing (§5.2)
    lines:
      boot:     { role: button,   dut_gpio: 9,  channel: ch1,  fixture_gpio: 41, via: direct, series_ohm: 1000 }
      status:   { role: led,      dut_gpio: 8,  channel: ch5,  fixture_gpio: 5,  active_level: low, series_ohm: 10000 }
      test_pin: { role: test_pin, dut_gpio: 10, channel: ch9,  fixture_gpio: 16, series_ohm: 1000 }
      analog:   { role: analog,   dut_gpio: 3,  channel: ch12, fixture_gpio: 11, dut_profile: c3o-analog, rc: { r_ohm: 10000, c_nf: 1000 } }   # M2-C3: a pwm channel through 10 kΩ / 1 µF
  1cdbd4000134:                    # pad-c3b: C3 OLED board #1
    profile: c3o-pad
    lines:
      boot:     { role: button,   dut_gpio: 9,  channel: ch0,  fixture_gpio: 42, via: direct, series_ohm: 1000 }
      status:   { role: led,      dut_gpio: 8,  channel: ch4,  fixture_gpio: 4,  active_level: low, series_ohm: 10000 }
      test_pin: { role: test_pin, dut_gpio: 10, channel: ch8,  fixture_gpio: 15, series_ohm: 1000 }
      analog:   { role: analog,   dut_gpio: 3,  channel: ch13, fixture_gpio: 12, dut_profile: c3o-analog, rc: { r_ohm: 10000, c_nf: 1000 } }   # M2-C3: a pwm channel through 10 kΩ / 1 µF
  58e6c5000564:                    # pad-c6: C6 Super Mini
    profile: c6-pad
    lines:
      boot:     { role: button,   dut_gpio: 9,  channel: ch2,  fixture_gpio: 40, via: direct, series_ohm: 1000 }
      status:   { role: led,      dut_gpio: 8,  channel: ch6,  fixture_gpio: 6,  decode: ws2812, series_ohm: 1000 }
      test_pin: { role: test_pin, dut_gpio: 20, channel: ch10, fixture_gpio: 17, series_ohm: 1000 }
  94a9900007cc:                    # pad-s3: Waveshare ESP32-S3-LCD-1.9
    profile: s3l-pad
    lines:
      boot:     { role: button,   dut_gpio: 0,  channel: ch3,  fixture_gpio: 39, via: direct, series_ohm: 1000 }
      status:   { role: led,      dut_gpio: 15, channel: ch7,  fixture_gpio: 7,  decode: ws2812, series_ohm: 1000 }
      test_pin: { role: test_pin, dut_gpio: 16, channel: ch11, fixture_gpio: 18, series_ohm: 1000 }
      en:       { role: en,       dut_pin: EN,  channel: ch14, fixture_gpio: 21, via: nfet, wired: false }   # never direct: an unpowered fixture would hold pad-s3 in reset
